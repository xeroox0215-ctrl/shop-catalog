<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Store</title>
    <!-- Официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Красивый космический шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ================= ОБНУЛЕНИЕ И БАЗА ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Unbounded', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ================= КОСМИЧЕСКИЙ ФОН ================= */
        .space-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        /* Медленно переливающиеся туманности */
        .nebula {
            position: absolute;
            width: 150vw;
            height: 150vw;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: rotateNebula 30s linear infinite;
        }

        .nebula-1 {
            top: -50%; left: -50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, transparent 60%);
            animation-duration: 25s;
        }

        .nebula-2 {
            bottom: -50%; right: -50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 60%);
            animation-duration: 35s;
            animation-direction: reverse;
        }

        @keyframes rotateNebula {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        /* Мерцающие звезды и паутина */
        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, white, transparent),
                radial-gradient(2px 2px at 40% 70%, white, transparent),
                radial-gradient(1px 1px at 80% 40%, white, transparent),
                radial-gradient(2px 2px at 60% 10%, white, transparent),
                radial-gradient(1px 1px at 90% 90%, white, transparent);
            background-size: 200px 200px;
            animation: twinkle 4s infinite alternate;
            opacity: 0.5;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* ================= ЭКРАНЫ ================= */
        .screen {
            display: none;
            padding: 30px 20px;
            min-height: 100vh;
            animation: fadeIn 0.5s ease;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ================= ЗАГОЛОВОК ================= */
        .glow-title {
            font-size: 52px;
            line-height: 1.1;
            font-weight: 900;
            text-align: center;
            margin-top: 40px;
            margin-bottom: 50px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #00d2ff, #8a2be2, #ffffff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 8s linear infinite;
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        /* ================= ГЛАВНОЕ МЕНЮ ================= */
        .main-menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        .menu-btn:active {
            transform: scale(0.96);
            background: rgba(0, 210, 255, 0.15);
            border-color: #00d2ff;
        }

        .btn-text {
            font-size: 20px;
            font-weight: 800;
            color: white;
        }

        /* ================= КАТАЛОГ ================= */
        .catalog-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            margin-top: 10px;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
        }

        .back-btn:active { background: rgba(255,255,255,0.2); }

        .catalog-title {
            font-size: 24px;
            font-weight: 800;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Карточки товаров */
        .product-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,210,255,0.15), transparent);
            transform: skewX(-20deg);
            animation: cardShimmer 5s infinite;
        }

        @keyframes cardShimmer {
            0% { left: -100%; }
            40%, 100% { left: 200%; }
        }

        .product-name {
            font-size: 16px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .product-price {
            color: #aaa;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .buy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy-btn:active {
            background: #00d2ff;
            color: black;
        }
    </style>
</head>
<body>

    <!-- Космический фон и звезды -->
    <div class="space-bg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="stars"></div>
    </div>

    <!-- Экран 1: Главное меню -->
    <div id="screen-main" class="screen active">
        <h1 class="glow-title">SCIPTYY<br>STORE</h1>
        
        <div class="main-menu-grid">
            <div class="menu-btn" onclick="openCatalog('accounts')">
                <span class="btn-text">🛒 Купить аккаунты</span>
            </div>
            <div class="menu-btn" onclick="openCatalog('numbers')">
                <span class="btn-text">📱 Купить номера</span>
            </div>
            <div class="menu-btn" onclick="goToBot('enter_promo')">
                <span class="btn-text">🎁 Промокод</span>
            </div>
            <div class="menu-btn" onclick="goToBot('ref_menu')">
                <span class="btn-text">👥 Рефералка</span>
            </div>
        </div>
    </div>

    <!-- Экран 2: Каталог товаров -->
    <div id="screen-catalog" class="screen">
        <div class="catalog-header">
            <button class="back-btn" onclick="closeCatalog()">← Назад</button>
            <h2 id="catalog-title" class="catalog-title">Каталог</h2>
        </div>
        <div class="catalog-grid" id="catalog-grid">
            <!-- Сюда JS вставит карточки -->
        </div>
    </div>

    <script>
        // Инициализация Телеграма
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // --- БАЗА ДАННЫХ ---
        const accountsData = [
            { code: "usa", name: "США", price: 46 },
            { code: "canada", name: "Канада", price: 99 },
            { code: "uk", name: "Великобритания", price: 125 },
            { code: "colombia", name: "Колумбия", price: 99 },
            { code: "germany", name: "Германия", price: 249 },
            { code: "kazakhstan", name: "Казахстан", price: 249 }
        ];

        const numbersData = [
            { code: "num_usa", name: "США", price: 15 },
            { code: "num_uk", name: "Великобритания", price: 20 },
            { code: "num_rus", name: "Россия", price: 10 },
            { code: "num_kz", name: "Казахстан", price: 12 }
        ];

        // --- ФУНКЦИИ ---
        function openCatalog(type) {
            const grid = document.getElementById('catalog-grid');
            const title = document.getElementById('catalog-title');
            grid.innerHTML = ''; 

            let dataToRender = [];
            if (type === 'accounts') {
                title.innerText = "Аккаунты";
                dataToRender = accountsData;
            } else if (type === 'numbers') {
                title.innerText = "Номера";
                dataToRender = numbersData;
            }

            dataToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${item.price} ₽</div>
                    </div>
                    <button class="buy-btn" onclick="confirmBuy('${item.code}', '${item.name}', ${item.price})">Купить</button>
                `;
                grid.appendChild(card);
            });

            document.getElementById('screen-main').classList.remove('active');
            document.getElementById('screen-catalog').classList.add('active');
        }

        function closeCatalog() {
            document.getElementById('screen-catalog').classList.remove('active');
            document.getElementById('screen-main').classList.add('active');
        }

        function confirmBuy(code, name, price) {
            const msg = `Вы уверены, что хотите купить ${name} за ${price} ₽?`;
            
            if (tg && tg.showConfirm) {
                tg.showConfirm(msg, (confirmed) => {
                    if (confirmed) {
                        tg.openTelegramLink(`https://t.me/sciptyy_storebot?start=buy_${code}`);
                        tg.close();
                    }
                });
            } else {
                // Для теста в обычном браузере
                if(confirm(msg)) {
                    window.location.href = `https://t.me/sciptyy_storebot?start=buy_${code}`;
                }
            }
        }

        function goToBot(action) {
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/sciptyy_storebot?start=${action}`);
                tg.close();
            } else {
                window.location.href = `https://t.me/sciptyy_storebot?start=${action}`;
            }
        }
    </script>
</body>
</html>
