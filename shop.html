<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ================= ОБНУЛЕНИЕ И БАЗА ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Unbounded', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ================= КОСМИЧЕСКИЙ ФОН ================= */
        .space-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .nebula {
            position: absolute;
            width: 150vw;
            height: 150vw;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: rotateNebula 30s linear infinite;
        }

        .nebula-1 {
            top: -50%; left: -50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, transparent 60%);
            animation-duration: 25s;
        }

        .nebula-2 {
            bottom: -50%; right: -50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 60%);
            animation-duration: 35s;
            animation-direction: reverse;
        }

        @keyframes rotateNebula {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, white, transparent),
                radial-gradient(2px 2px at 40% 70%, white, transparent),
                radial-gradient(1px 1px at 80% 40%, white, transparent),
                radial-gradient(2px 2px at 60% 10%, white, transparent),
                radial-gradient(1px 1px at 90% 90%, white, transparent);
            background-size: 200px 200px;
            animation: twinkle 4s infinite alternate;
            opacity: 0.5;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* ================= ЭКРАНЫ ================= */
        .screen {
            display: none;
            padding: 30px 20px;
            min-height: 100vh;
            animation: fadeIn 0.5s ease;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glow-title {
            font-size: 46px;
            line-height: 1.1;
            font-weight: 900;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 25px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #00d2ff, #8a2be2, #ffffff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 8s linear infinite;
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        /* ================= ХЭЛЛОУИН ДЕКОР ДЛЯ ЭКРАНОВ ================= */
        .halloween-decor {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* Чтобы не мешали нажимать кнопки */
            overflow: hidden;
            z-index: 0;
        }

        .decor-web {
            position: absolute;
            top: -20px; left: -20px;
            width: 120px; height: 120px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M0,0 L100,100 M0,20 L80,100 M20,0 L100,80 M0,50 L50,100 M50,0 L100,50 M0,0 Q50,0 100,50 Q50,100 0,50" stroke="rgba(255,255,255,0.15)" fill="none" stroke-width="1"/></svg>');
            background-size: cover;
            transform: rotate(180deg);
            opacity: 0.6;
            animation: floatWeb 8s ease-in-out infinite alternate;
        }

        .decor-spider {
            position: absolute;
            top: 0; left: 40px;
            font-size: 24px;
            animation: spiderDrop 4s ease-in-out infinite;
            z-index: 1;
        }

        @keyframes floatWeb {
            0% { transform: rotate(170deg) scale(1); }
            100% { transform: rotate(190deg) scale(1.1); }
        }

        @keyframes spiderDrop {
            0%, 100% { transform: translateY(10px); }
            50% { transform: translateY(25px); }
        }

        /* ================= ХЭЛЛОУИН БАННЕР ================= */
        .halloween-banner {
            position: relative;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            margin-bottom: 25px;
            padding: 25px 20px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            background: #111;
            transition: transform 0.2s;
            z-index: 2;
        }

        .halloween-banner:active { transform: scale(0.97); }

        .banner-glow {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, #2a0845, #6441A5, #ff416c, #2a0845);
            background-size: 300% 300%;
            animation: bannerGradient 6s ease infinite;
            z-index: 0;
            opacity: 0.8;
        }

        @keyframes bannerGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .banner-spiderweb {
            position: absolute;
            top: -50%; left: -20%;
            width: 200px; height: 200px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="M0,0 L100,100 M0,20 L80,100 M20,0 L100,80 M0,50 L50,100 M50,0 L100,50 M0,0 Q50,0 100,50 Q50,100 0,50" stroke="rgba(255,255,255,0.15)" fill="none" stroke-width="1"/></svg>');
            background-size: cover;
            z-index: 1;
            animation: floatWeb 10s ease-in-out infinite alternate;
        }

        .banner-spider {
            position: absolute;
            top: 0; right: 25px;
            font-size: 28px;
            z-index: 2;
            animation: spiderDrop 4s ease-in-out infinite;
            text-shadow: 0 0 10px rgba(0,0,0,0.8);
        }

        .banner-content {
            position: relative;
            z-index: 3;
            width: 100%;
        }

        .banner-tag {
            display: inline-block;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #ffd700;
        }

        .banner-title {
            font-size: 22px;
            font-weight: 900;
            color: #fff;
            margin-bottom: 5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .banner-subtitle {
            font-size: 11px;
            color: #eee;
            font-weight: 500;
        }

        /* ================= ГЛАВНОЕ МЕНЮ ================= */
        .main-menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-btn:active {
            transform: scale(0.96);
            background: rgba(0, 210, 255, 0.15);
            border-color: #00d2ff;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 800;
            color: white;
        }

        /* ================= КАТАЛОГ ================= */
        .catalog-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
        }

        .back-btn:active { background: rgba(255,255,255,0.2); }

        .catalog-title {
            font-size: 20px;
            font-weight: 800;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            position: relative;
            z-index: 2;
        }

        .product-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,210,255,0.15), transparent);
            transform: skewX(-20deg);
            animation: cardShimmer 5s infinite;
        }

        @keyframes cardShimmer {
            0% { left: -100%; }
            40%, 100% { left: 200%; }
        }

        .product-name {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .product-price {
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .buy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy-btn:active {
            background: #00d2ff;
            color: black;
        }

        /* ================= ИНФО ЭКРАНЫ ================= */
        .info-container {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
            display: flex;
            flex-direction: column;
            min-height: 250px;
            position: relative;
            z-index: 2;
        }
        
        .info-container p { margin-bottom: 15px; }

        .info-btn {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #8a2be2);
            color: white;
            text-align: center;
            padding: 16px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            margin-top: auto; 
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 210, 255, 0.3);
        }
        
        .info-btn:active { opacity: 0.8; transform: scale(0.98); }
    </style>
</head>
