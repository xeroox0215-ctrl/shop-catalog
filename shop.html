<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* ================= ОБНУЛЕНИЕ И БАЗА ================= */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Unbounded', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* ================= КОСМИЧЕСКИЙ ФОН ================= */
        .space-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #000;
        }

        .nebula {
            position: absolute;
            width: 150vw;
            height: 150vw;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.6;
            animation: rotateNebula 30s linear infinite;
        }

        .nebula-1 {
            top: -50%; left: -50%;
            background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, transparent 60%);
            animation-duration: 25s;
        }

        .nebula-2 {
            bottom: -50%; right: -50%;
            background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 60%);
            animation-duration: 35s;
            animation-direction: reverse;
        }

        @keyframes rotateNebula {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.2); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .stars {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(1px 1px at 10% 20%, white, transparent),
                radial-gradient(2px 2px at 40% 70%, white, transparent),
                radial-gradient(1px 1px at 80% 40%, white, transparent),
                radial-gradient(2px 2px at 60% 10%, white, transparent),
                radial-gradient(1px 1px at 90% 90%, white, transparent);
            background-size: 200px 200px;
            animation: twinkle 4s infinite alternate;
            opacity: 0.5;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        /* ================= ЭКРАНЫ ================= */
        .screen {
            display: none;
            padding: 30px 20px;
            min-height: 100vh;
            animation: fadeIn 0.5s ease;
        }
        .screen.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glow-title {
            font-size: 52px;
            line-height: 1.1;
            font-weight: 900;
            text-align: center;
            margin-top: 30px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            background: linear-gradient(90deg, #ffffff, #00d2ff, #8a2be2, #ffffff);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textShimmer 8s linear infinite;
        }

        @keyframes textShimmer {
            0% { background-position: 0% center; }
            100% { background-position: 300% center; }
        }

        /* ================= ГЛАВНОЕ МЕНЮ ================= */
        .main-menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 20px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .menu-btn:active {
            transform: scale(0.96);
            background: rgba(0, 210, 255, 0.15);
            border-color: #00d2ff;
        }

        .btn-text {
            font-size: 16px;
            font-weight: 800;
            color: white;
        }

        /* ================= КАТАЛОГ ================= */
        .catalog-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
            margin-top: 10px;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 800;
            font-size: 16px;
        }

        .back-btn:active { background: rgba(255,255,255,0.2); }

        .catalog-title {
            font-size: 20px;
            font-weight: 800;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .product-card {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .product-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0,210,255,0.15), transparent);
            transform: skewX(-20deg);
            animation: cardShimmer 5s infinite;
        }

        @keyframes cardShimmer {
            0% { left: -100%; }
            40%, 100% { left: 200%; }
        }

        .product-name {
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 5px;
        }

        .product-price {
            color: #aaa;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 15px;
        }

        .buy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            padding: 10px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
        }

        .buy-btn:active {
            background: #00d2ff;
            color: black;
        }

        /* ================= ИНФО ЭКРАНЫ ================= */
        .info-container {
            background: rgba(20, 20, 20, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 25px 20px;
            font-size: 14px;
            line-height: 1.6;
            color: #ddd;
        }
        
        .info-container p {
            margin-bottom: 15px;
        }

        .info-btn {
            display: block;
            width: 100%;
            background: linear-gradient(90deg, #00d2ff, #8a2be2);
            color: white;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            margin-top: 20px;
            border: none;
            cursor: pointer;
        }
        
        .info-btn:active { opacity: 0.8; }
    </style>
</head>
<body>

    <div class="space-bg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="stars"></div>
    </div>

    <!-- ЭКРАН 1: ГЛАВНОЕ МЕНЮ -->
    <div id="screen-main" class="screen active">
        <h1 class="glow-title">SCIPTYY<br>STORE</h1>
        
        <div class="main-menu-grid">
            <div class="menu-btn" onclick="openCatalog()">
                <span class="btn-text">🛒 Купить аккаунты</span>
            </div>
            <div class="menu-btn" onclick="goToBot('cases_menu')">
                <span class="btn-text">📦 Кейсы</span>
            </div>
            <div class="menu-btn" onclick="goToBot('daily_roll')">
                <span class="btn-text">🎰 Рулетка дня</span>
            </div>
            <div class="menu-btn" onclick="goToBot('profile')">
                <span class="btn-text">👤 Профиль</span>
            </div>
            <div class="menu-btn" onclick="goToBot('enter_promo')">
                <span class="btn-text">🎁 Промокод</span>
            </div>
            <div class="menu-btn" onclick="goToBot('ref_menu')">
                <span class="btn-text">👥 Рефералка</span>
            </div>
            <div class="menu-btn" onclick="openInfo('support')">
                <span class="btn-text">🆘 Поддержка</span>
            </div>
            <div class="menu-btn" onclick="window.open('https://t.me/sciptyyrewievs', '_blank')">
                <span class="btn-text">⭐ Отзывы</span>
            </div>
            <div class="menu-btn" onclick="openInfo('about')">
                <span class="btn-text">ℹ️ О нас</span>
            </div>
            <div class="menu-btn" onclick="openInfo('terms')">
                <span class="btn-text">📜 Соглашение</span>
            </div>
            <div class="menu-btn" onclick="openInfo('privacy')">
                <span class="btn-text">📄 Политика</span>
            </div>
        </div>
    </div>

    <!-- ЭКРАН 2: КАТАЛОГ АККАУНТОВ -->
    <div id="screen-catalog" class="screen">
        <div class="catalog-header">
            <button class="back-btn" onclick="showScreen('screen-main')">← Назад</button>
            <h2 class="catalog-title">Аккаунты</h2>
        </div>
        <div class="catalog-grid" id="catalog-grid"></div>
    </div>

    <!-- ЭКРАН 3: ИНФО СТРАНИЦЫ (Поддержка, О нас, Соглашение, Политика) -->
    <div id="screen-info" class="screen">
        <div class="catalog-header">
            <button class="back-btn" onclick="showScreen('screen-main')">← Назад</button>
            <h2 id="info-title" class="catalog-title">Информация</h2>
        </div>
        <div class="info-container" id="info-content">
            <!-- Сюда JS вставит текст -->
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();

        // --- ВСЕ СТРАНЫ ИЗ ТВОЕГО КОДА ---
        const accountsData = [
            { code: "usa", name: "🇺🇸 США", price: 46 },
            { code: "canada", name: "🇨🇦 Канада", price: 99 },
            { code: "colombia", name: "🇨🇴 Колумбия", price: 99 },
            { code: "uk", name: "🇬🇧 Великобритания", price: 125 },
            { code: "bangladesh", name: "🇧🇩 Бангладеш", price: 99 },
            { code: "argentina", name: "🇦🇷 Аргентина", price: 125 },
            { code: "uzbekistan", name: "🇺🇿 Узбекистан", price: 175 },
            { code: "brazil", name: "🇧🇷 Бразилия", price: 175 },
            { code: "thailand", name: "🇹🇭 Таиланд", price: 199 },
            { code: "france", name: "🇫🇷 Франция", price: 199 },
            { code: "germany", name: "🇩🇪 Германия", price: 249 },
            { code: "kazakhstan", name: "🇰🇿 Казахстан", price: 249 },
            { code: "ukraine", name: "🇺🇦 Украина", price: 249 },
            { code: "poland", name: "🇵🇱 Польша", price: 249 },
            { code: "mauritania", name: "🇲🇷 Мавритания", price: 299 }
        ];

        // --- ТЕКСТА ДЛЯ ИНФО СТРАНИЦ ---
        const infoTexts = {
            support: {
                title: "Поддержка",
                text: "<p>Работаем 24/7 ⏰</p><p>Ответим вам на любой вопрос и поможем с покупкой или выдачей товара.</p><p>Нажмите кнопку ниже, чтобы написать нам в бота.</p>",
                btn: "Написать в поддержку",
                action: "support"
            },
            about: {
                title: "О нас",
                text: "<p>Sciptyy Store — это <b>самый лучший магазин</b> качественных аккаунтов Telegram.</p><p>✅ Работаем 24/7 без выходных.<br>✅ Мгновенная авто-выдача.<br>✅ Работаем без обмана и скрытых комиссий.</p><p>Нам доверяют сотни клиентов!</p>",
                btn: "В главное меню",
                action: "back"
            },
            terms: {
                title: "Соглашение",
                text: "<p>Покупая товар в нашем магазине, вы автоматически соглашаетесь со всеми правилами Telegram и нашего бота.</p><p>Вы действуете <b>добровольно</b> и на свой страх и риск. Мы гарантируем качество товара, но не несем ответственности за дальнейшее использование аккаунтов.</p><p>Мы ничего не нарушаем и работаем строго по правилам.</p>",
                btn: "В главное меню",
                action: "back"
            },
            privacy: {
                title: "Политика",
                text: "<p>Мы ценим вашу конфиденциальность.</p><p>Бот собирает только ваш ID и username для выдачи товаров и работы реферальной системы.</p><p>Ваши данные <b>защищены</b> и никогда не передаются третьим лицам. Мы не нарушаем законы и правила Telegram.</p>",
                btn: "В главное меню",
                action: "back"
            }
        };

        // --- ЛОГИКА ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function openCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = ''; 

            accountsData.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div>
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${item.price} ₽</div>
                    </div>
                    <button class="buy-btn" onclick="confirmBuy('${item.code}', '${item.name}', ${item.price})">Купить</button>
                `;
                grid.appendChild(card);
            });

            showScreen('screen-catalog');
        }

        function openInfo(type) {
            const data = infoTexts[type];
            document.getElementById('info-title').innerText = data.title;
            
            const contentDiv = document.getElementById('info-content');
            contentDiv.innerHTML = data.text;

            if (data.action !== "back") {
                const btn = document.createElement('button');
                btn.className = 'info-btn';
                btn.innerText = data.btn;
                btn.onclick = () => goToBot(data.action);
                contentDiv.appendChild(btn);
            } else {
                const btn = document.createElement('button');
                btn.className = 'info-btn';
                btn.innerText = data.btn;
                btn.onclick = () => showScreen('screen-main');
                contentDiv.appendChild(btn);
            }

            showScreen('screen-info');
        }

        function confirmBuy(code, name, price) {
            const msg = `Вы уверены, что хотите купить ${name} за ${price} ₽?`;
            
            if (tg && tg.showConfirm) {
                tg.showConfirm(msg, (confirmed) => {
                    if (confirmed) {
                        tg.openTelegramLink(`https://t.me/sciptyy_storebot?start=buy_${code}`);
                        tg.close();
                    }
                });
            } else {
                if(confirm(msg)) {
                    window.location.href = `https://t.me/sciptyy_storebot?start=buy_${code}`;
                }
            }
        }

        function goToBot(action) {
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/sciptyy_storebot?start=${action}`);
                tg.close();
            } else {
                window.location.href = `https://t.me/sciptyy_storebot?start=${action}`;
            }
        }
    </script>
</body>
</html>
