<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Космический фон и звезды -->
    <div class="space-bg">
        <div class="nebula nebula-1"></div>
        <div class="nebula nebula-2"></div>
        <div class="stars"></div>
    </div>

    <!-- Экран 1: Главное меню -->
    <div id="screen-main" class="screen active">
        <h1 class="glow-title">SCIPTYY<br>STORE</h1>
        
        <div class="main-menu-grid">
            <div class="menu-btn" onclick="openCatalog('accounts')">
                <span class="btn-text">🛒 Купить аккаунты</span>
            </div>
            <div class="menu-btn" onclick="openCatalog('numbers')">
                <span class="btn-text">📱 Купить номера</span>
            </div>
            <div class="menu-btn" onclick="goToBot('enter_promo')">
                <span class="btn-text">🎁 Промокод</span>
            </div>
            <div class="menu-btn" onclick="goToBot('ref_menu')">
                <span class="btn-text">👥 Рефералка</span>
            </div>
        </div>
    </div>

    <!-- Экран 2: Каталог товаров (Аккаунты или Номера) -->
    <div id="screen-catalog" class="screen">
        <div class="catalog-header">
            <button class="back-btn" onclick="closeCatalog()">← Назад</button>
            <h2 id="catalog-title" class="catalog-title">Каталог</h2>
        </div>
        <div class="catalog-grid" id="catalog-grid">
            <!-- Сюда JS вставит карточки -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
