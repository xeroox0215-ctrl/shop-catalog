<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sciptyy Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Unbounded', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: #000; color: #fff; min-height: 100vh; overflow-x: hidden; position: relative; }
        
        /* Космос */
        .space-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; overflow: hidden; background: #000; }
        .nebula { position: absolute; width: 150vw; height: 150vw; border-radius: 50%; filter: blur(80px); opacity: 0.6; animation: rotateNebula 30s linear infinite; }
        .nebula-1 { top: -50%; left: -50%; background: radial-gradient(circle, rgba(0, 210, 255, 0.4) 0%, transparent 60%); }
        .nebula-2 { bottom: -50%; right: -50%; background: radial-gradient(circle, rgba(138, 43, 226, 0.4) 0%, transparent 60%); animation-direction: reverse; }
        @keyframes rotateNebula { 0% { transform: rotate(0deg) scale(1); } 100% { transform: rotate(360deg) scale(1.2); } }
        .stars { position: absolute; width: 100%; height: 100%; background-image: radial-gradient(1px 1px at 10% 20%, white, transparent), radial-gradient(2px 2px at 40% 70%, white, transparent); background-size: 200px 200px; animation: twinkle 4s infinite alternate; opacity: 0.5; }
        @keyframes twinkle { 0% { opacity: 0.3; } 100% { opacity: 0.8; } }
        
        /* Экраны */
        .screen { display: none; padding: 30px 20px; min-height: 100vh; animation: fadeIn 0.5s ease; }
        .screen.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Заголовок */
        .glow-title { font-size: 46px; line-height: 1.1; font-weight: 900; text-align: center; margin-top: 20px; margin-bottom: 25px; background: linear-gradient(90deg, #ffffff, #00d2ff, #8a2be2, #ffffff); background-size: 300% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: textShimmer 8s linear infinite; position: relative; z-index: 2; }
        @keyframes textShimmer { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }

        /* Кнопки меню */
        .main-menu-grid { display: flex; flex-direction: column; gap: 15px; position: relative; z-index: 2; }
        .menu-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 20px; border-radius: 16px; text-align: center; cursor: pointer; transition: 0.3s; }
        .menu-btn:active { transform: scale(0.96); background: rgba(0, 210, 255, 0.15); border-color: #00d2ff; }
        .btn-text { font-size: 16px; font-weight: 800; color: white; }

        /* Карточки */
        .catalog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; position: relative; z-index: 2; }
        .product-card { background: rgba(20, 20, 20, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border-radius: 16px; padding: 15px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden; }
        .product-name { font-size: 14px; font-weight: 800; margin-bottom: 5px; }
        .product-price { color: #aaa; font-size: 13px; font-weight: 500; margin-bottom: 5px; }
        
        /* Переливающиеся кнопки покупки */
        .buy-btn { background: linear-gradient(90deg, #0052ff, #00d2ff, #0052ff); background-size: 200% auto; border: none; color: white; padding: 12px; border-radius: 10px; font-weight: 800; font-size: 13px; cursor: pointer; animation: btnShimmer 3s linear infinite; margin-top: 10px; }
        @keyframes btnShimmer { to { background-position: 200% center; } }
        .buy-btn:active { transform: scale(0.95); }
        .buy-btn:disabled { background: #333; animation: none; color: #777; cursor: not-allowed; }

        /* Профиль */
        .balance-card { background: linear-gradient(135deg, #00d2ff, #8a2be2); padding: 20px; border-radius: 16px; text-align: center; margin-bottom: 20px; position: relative; z-index: 2; }
        .balance-amount { font-size: 28px; font-weight: 900; }
        .purchase-item { background: rgba(255,255,255,0.05); padding: 10px; border-radius: 10px; margin-bottom: 10px; font-size: 12px; border: 1px solid rgba(255,255,255,0.05); }

        /* Рулетка (Колесо) */
        .wheel-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 30px; position: relative; z-index: 2; }
        .wheel { width: 280px; height: 280px; border-radius: 50%; border: 8px solid #222; position: relative; overflow: hidden; box-shadow: 0 0 30px rgba(0, 210, 255, 0.4); transition: transform 4s cubic-bezier(0.25, 0.1, 0.1, 1); background: conic-gradient(#00d2ff 0deg 90deg, #8a2be2 90deg 180deg, #ff416c 180deg 270deg, #ffd700 270deg 360deg); }
        .wheel::after { content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 40px; height: 40px; background: #111; border-radius: 50%; border: 4px solid #fff; }
        .wheel-pointer { position: absolute; top: -15px; font-size: 40px; z-index: 10; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.5)); }
        .wheel-text { position: absolute; width: 100%; height: 100%; }
        .wheel-text span { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; font-weight: 900; font-size: 14px; color: #000; }
        
        .roll-btn { margin-top: 40px; background: linear-gradient(90deg, #ff416c, #ff4b2b); color: white; border: none; padding: 18px 40px; border-radius: 50px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(255, 65, 108, 0.5); }
        .roll-btn:active { transform: scale(0.95); }
    </style>
</head><body>
    <div class="space-bg"><div class="nebula nebula-1"></div><div class="nebula nebula-2"></div><div class="stars"></div></div>

    <!-- ГЛАВНЫЙ ЭКРАН -->
    <div id="screen-main" class="screen active">
        <h1 class="glow-title">SCIPTYY<br>STORE</h1>
        <div class="main-menu-grid">
            <div class="menu-btn" onclick="openCatalog()"><span class="btn-text">🛒 Купить аккаунты</span></div>
            <div class="menu-btn" onclick="showScreen('screen-profile')"><span class="btn-text">👤 Профиль</span></div>
            <div class="menu-btn" onclick="showScreen('screen-roll')"><span class="btn-text">🎰 Рулетка дня</span></div>
            <div class="menu-btn" onclick="goToBot('cases_menu')"><span class="btn-text">📦 Кейсы</span></div>
            <div class="menu-btn" onclick="goToBot('enter_promo')"><span class="btn-text">🎁 Промокод</span></div>
            <div class="menu-btn" onclick="goToBot('ref_menu')"><span class="btn-text">👥 Рефералка</span></div>
            <div class="menu-btn" onclick="goToBot('support')"><span class="btn-text">🆘 Поддержка</span></div>
        </div>
    </div>

    <!-- КАТАЛОГ -->
    <div id="screen-catalog" class="screen">
        <div style="display:flex; gap:10px; margin-bottom:20px; position:relative; z-index:2;">
            <button class="back-btn" onclick="showScreen('screen-main')" style="background:rgba(255,255,255,0.1); border:none; color:white; padding:10px 15px; border-radius:12px; font-weight:800; cursor:pointer;">← Назад</button>
            <h2 style="font-size:20px; font-weight:800;">Аккаунты</h2>
        </div>
        <div class="catalog-grid" id="catalog-grid"><div style="grid-column:span 2;">Загрузка...</div></div>
    </div>

    <!-- ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div style="display:flex; gap:10px; margin-bottom:20px; position:relative; z-index:2;">
            <button class="back-btn" onclick="showScreen('screen-main')" style="background:rgba(255,255,255,0.1); border:none; color:white; padding:10px 15px; border-radius:12px; font-weight:800; cursor:pointer;">← Назад</button>
            <h2 style="font-size:20px; font-weight:800;">Профиль</h2>
        </div>
        <div class="balance-card">
            <div style="font-size: 14px; opacity: 0.8;">Ваш баланс</div>
            <div class="balance-amount" id="profile-balance">0 ₽</div>
        </div>
        <h3 style="position: relative; z-index: 2; margin-bottom: 10px;">История:</h3>
        <div id="profile-purchases" style="position: relative; z-index: 2;"></div>
    </div>

    <!-- РУЛЕТКА -->
    <div id="screen-roll" class="screen">
        <div style="display:flex; gap:10px; margin-bottom:20px; position:relative; z-index:2;">
            <button class="back-btn" onclick="showScreen('screen-main')" style="background:rgba(255,255,255,0.1); border:none; color:white; padding:10px 15px; border-radius:12px; font-weight:800; cursor:pointer;">← Назад</button>
            <h2 style="font-size:20px; font-weight:800;">Рулетка дня</h2>
        </div>
        
        <div class="wheel-container">
            <div class="wheel-pointer">🔻</div>
            <div class="wheel" id="wheel">
                <div class="wheel-text">
                    <span style="transform: rotate(45deg) translate(80px, -20px);">1 ₽</span>
                    <span style="transform: rotate(135deg) translate(80px, -20px);">3 ₽</span>
                    <span style="transform: rotate(225deg) translate(80px, -20px);">2 ₽</span>
                    <span style="transform: rotate(315deg) translate(80px, -20px);">Промокод</span>
                </div>
            </div>
            <button class="roll-btn" id="roll-btn" onclick="spinWheel()">Крутить</button>
            <div id="roll-result" style="margin-top:20px; font-size:20px; font-weight:800; text-align:center; color:#00d2ff; min-height:30px;"></div>
        </div>
    </div>

    <!-- МОДАЛКА ПОКУПКИ -->
    <div id="modal-buy" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index: 999; padding:20px; flex-direction:column; justify-content:center;">
        <div style="background:#111; border:1px solid #333; padding:25px; border-radius:20px; text-align:center;">
            <h2 id="modal-title" style="font-size:22px; margin-bottom:10px;">Покупка</h2>
            <p id="modal-price" style="color:#888; margin-bottom:25px;">Цена: 46 ₽</p>
            
            <button id="btn-pay-bal" style="width:100%; padding:15px; border-radius:12px; background:linear-gradient(90deg, #00d2ff, #0052ff); border:none; color:white; font-weight:800; font-size:16px; margin-bottom:10px;" onclick="buyItem('balance')">Купить с баланса (₽)</button>
            <button id="btn-pay-stars" style="width:100%; padding:15px; border-radius:12px; background:linear-gradient(90deg, #ffd700, #ff8c00); border:none; color:black; font-weight:800; font-size:16px; margin-bottom:10px;" onclick="buyItem('stars')">Купить за звезды (⭐)</button>
            
            <button style="width:100%; padding:12px; border-radius:12px; background:transparent; border:1px solid #555; color:#aaa; font-weight:800;" onclick="closeModal()">Отмена</button>
        </div>
    </div>    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) tg.expand();
        const API_URL = "https://sciptyy-api.onrender.com";
        
        let userProfile = { balance: 0, last_roll: 0 };
        let accountsData = [];
        let selectedCountry = null;
        let selectedPrice = 0;

        async function loadData() {
            try {
                const res = await fetch(`${API_URL}/api/profile`, { headers: { "X-Telegram-Init-Data": tg.initData } });
                const data = await res.json();
                if (data.status === "ok") {
                    userProfile = data.profile;
                    accountsData = data.shop;
                    
                    document.getElementById('profile-balance').innerText = `${userProfile.balance.toFixed(2)} ₽`;
                    
                    const pDiv = document.getElementById('profile-purchases');
                    pDiv.innerHTML = data.purchases.length > 0 ? data.purchases.map(p => `
                        <div class="purchase-item">
                            <div style="font-weight: bold; color: #00d2ff;">${p.name}</div>
                            <div style="color: #888;">${p.price} ₽ • ${p.date.split(' ')[0]}</div>
                        </div>`).join('') : '<div style="color:#888;">Покупок нет</div>';
                }
            } catch(e) { console.log(e); }
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if(id === 'screen-profile') loadData();
        }

        function openCatalog() {
            const grid = document.getElementById('catalog-grid');
            grid.innerHTML = '';
            accountsData.forEach(item => {
                const stockColor = item.stock > 0 ? '#00d2ff' : '#ff4444';
                const stockText = item.stock > 0 ? `В наличии: ${item.stock}` : 'Нет в наличии';
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-name">${item.name}</div>
                        <div class="product-price">${item.price} ₽</div>
                        <div style="color:${stockColor}; font-size:11px; margin-bottom:5px;">${stockText}</div>
                        <button class="buy-btn" ${item.stock <= 0 ? 'disabled' : ''} onclick="openModal('${item.code}', '${item.name}', ${item.price}, ${item.stock})">Купить</button>
                    </div>
                `;
            });
            showScreen('screen-catalog');
        }

        function openModal(code, name, price, stock) {
            if(stock <= 0) return;
            selectedCountry = code;
            selectedPrice = price;
            document.getElementById('modal-title').innerText = name;
            document.getElementById('modal-price').innerText = `Цена: ${price} ₽`;
            document.getElementById('modal-buy').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal-buy').style.display = 'none';
        }

        async function buyItem(method) {
            if (method === 'stars') {
                closeModal();
                tg.openTelegramLink(`https://t.me/sciptyy_storebot?start=buy_${selectedCountry}`);
                tg.close();
                return;
            }
            
            closeModal();
            tg.showAlert("Списываем средства...");
            try {
                const res = await fetch(`${API_URL}/api/buy`, {
                    method: 'POST',
                    headers: { "X-Telegram-Init-Data": tg.initData, "Content-Type": "application/json" },
                    body: JSON.stringify({ country: selectedCountry, method: "balance" })
                });
                const data = await res.json();
                if (data.status === 'ok') {
                    tg.showAlert(`✅ ${data.message}\nТовар: ${data.item}\n\nНапишите в поддержку для выдачи.`);
                    loadData();
                } else {
                    tg.showAlert(`❌ ${data.error}`);
                }
            } catch(e) {
                tg.showAlert("Ошибка сервера");
            }
        }

        let isSpinning = false;
        async function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;
            const wheel = document.getElementById('wheel');
            const btn = document.getElementById('roll-btn');
            const resDiv = document.getElementById('roll-result');
            
            btn.innerText = "Крутим...";
            resDiv.innerText = "";
            
            // Анимация кручения (просто рандомный поворот)
            const randomDeg = 1440 + Math.floor(Math.random() * 360);
            wheel.style.transform = `rotate(${randomDeg}deg)`;
            
            try {
                const res = await fetch(`${API_URL}/api/roll`, {
                    method: 'POST',
                    headers: { "X-Telegram-Init-Data": tg.initData }
                });
                const data = await res.json();
                
                setTimeout(() => {
                    if (data.status === 'ok') {
                        resDiv.innerText = `🎉 Вы выиграли: ${data.prize}`;
                        resDiv.style.color = "#ffd700";
                        loadData();
                    } else {
                        resDiv.innerText = `❌ ${data.error}`;
                        resDiv.style.color = "#ff4444";
                    }
                    btn.innerText = "Крутить";
                    wheel.style.transform = `rotate(0deg)`; // Сброс после анимации
                    isSpinning = false;
                }, 4000);
            } catch(e) {
                setTimeout(() => { btn.innerText = "Крутить"; isSpinning = false; }, 4000);
            }
        }

        function goToBot(action) {
            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/sciptyy_storebot?start=${action}`);
                tg.close();
            }
        }

        // Запуск
        loadData();
    </script>
</body>
</html>
